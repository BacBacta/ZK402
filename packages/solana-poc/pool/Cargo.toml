[package]
name = "pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
light-sdk = { version = "0.24.0", features = ["anchor", "cpi-context", "keccak"] }
gnark-verifier-solana = "2"
solana-poseidon = "3"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[build-dependencies]
gnark-verifier-solana = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
overflow-checks = true
